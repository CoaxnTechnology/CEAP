services:
  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      DB_URI: postgresql://${POSTGRES_USER:-documind_user}:${POSTGRES_PASSWORD:-documind_pass}@postgres:5432/${POSTGRES_DB:-documind}
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./frontend/dist:/app/frontend/dist
      - ./chroma_db:/app/chroma_db
      - ./storage:/app/backend/storage
      - ./backend/app/storage:/app/backend/app/storage
      - ./backend/app/uploads:/app/backend/app/uploads
      - flask_session:/app/backend/flask_session
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  flask_session:
