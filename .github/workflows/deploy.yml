name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          set +e
          ssh-keyscan -T 15 -p ${{ secrets.RSYNC_PORT || '22' }} ${{ secrets.VPS_HOST }} > ~/.ssh/known_hosts 2>/tmp/keyscan.err
          rc=$?
          cat /tmp/keyscan.err
          exit $rc

      - name: Sync frontend build
        run: |
          rsync -az --delete -e "ssh -p ${{ secrets.RSYNC_PORT || '22' }}" \
            frontend/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/CEAP/frontend/dist/

      - name: Sync backend + config
        run: |
          rsync -az -e "ssh -p ${{ secrets.RSYNC_PORT || '22' }}" \
            backend/Dockerfile backend/requirements.txt backend/run.py backend/app \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/CEAP/backend/
          rsync -az -e "ssh -p ${{ secrets.RSYNC_PORT || '22' }}" \
            docker-compose.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/CEAP/docker-compose.yml

      - name: Rebuild and restart
        run: |
          ssh -p ${{ secrets.RSYNC_PORT || '22' }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cd /opt/CEAP && docker compose up -d --build backend'